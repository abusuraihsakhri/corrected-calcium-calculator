name: GitHub Pages Smoke Test

on:
  workflow_run:
    workflows: ["Corrected Calcium Calculator CI"]
    types: [completed]

permissions:
  contents: read

jobs:
  verify-pages:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify published calculator
        env:
          PAGES_URL: https://abusuraihsakhri.github.io/corrected-calcium-calculator/
        run: |
          for attempt in {1..18}; do
            status="$(curl --silent --show-error --location --max-time 15 --output /tmp/pages.html --write-out '%{http_code}' "$PAGES_URL" 2>/dev/null || true)"
            if [ "$status" = "200" ] \
              && grep -Fq "<title>Corrected Calcium Calculator</title>" /tmp/pages.html \
              && grep -Fq "Important limitation" /tmp/pages.html \
              && grep -Fq "Albumin-adjusted total calcium" /tmp/pages.html; then
              echo "GitHub Pages calculator is live."
              exit 0
            fi
            echo "Attempt $attempt: HTTP ${status:-unavailable}; waiting for published content."
            sleep 10
          done

          echo "Published Pages content did not match the production calculator." >&2
          echo "Last HTTP status: ${status:-unavailable}" >&2
          head -c 1000 /tmp/pages.html 2>/dev/null || true
          exit 1
