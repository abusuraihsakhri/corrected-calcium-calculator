name: Corrected Calcium Calculator CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability audit
        if: matrix.python-version == '3.12'
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r requirements.txt

      - name: Build container
        if: matrix.python-version == '3.12'
        run: docker build -t corrected-calcium-calculator:ci .

      - name: Verify audit-chain implementation
        run: |
          python - <<'PY'
          from agents.base import AuditTrail

          trail = AuditTrail(secret_key="ci-verification-key")
          trail.log("ci", "test", "VERIFY", {"status": "ok"})
          assert trail.verify_integrity() is True
          trail.logs[0]["event_type"] = "TAMPERED"
          assert trail.verify_integrity() is False
          print("Audit signature verification passed")
          PY
