name: Release

on:
  workflow_run:
    workflows: ["Corrected Calcium Calculator CI"]
    types: [completed]

permissions:
  contents: write

jobs:
  release-v1:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Create v1.0.0 once
        run: |
          if gh release view v1.0.0 --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists; no release action needed."
            exit 0
          fi

          gh release create v1.0.0 \
            --repo "$REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v1.0.0" \
            --notes "First audited release. Adds a functional static GitHub Pages calculator, fixes HMAC audit verification and CSV parsing defects, makes formula-derived clinical output non-prescriptive, adds a corrected-calcium API endpoint, hardens Docker execution, and expands CI with dependency and container checks."
