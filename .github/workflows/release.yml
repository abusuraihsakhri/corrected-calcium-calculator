name: Release

on:
  workflow_run:
    workflows: ["GitHub Pages Smoke Test"]
    types: [completed]

permissions:
  contents: write

jobs:
  release-v1:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'master' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_VERSION: v1.0.1

    steps:
      - name: Create final audited release once
        run: |
          if gh release view "$RELEASE_VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_VERSION already exists; no release action needed."
            exit 0
          fi

          gh release create "$RELEASE_VERSION" \
            --repo "$REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "$RELEASE_VERSION" \
            --notes "Audited release with verified GitHub Pages publication. Includes the functional browser calculator, HMAC audit verification fixes, safer CSV and API input handling, non-prescriptive clinical output with evidence limitations, Docker hardening, dependency auditing, and live deployment smoke testing."
