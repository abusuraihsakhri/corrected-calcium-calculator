version: '3.8'

services:
  corrected-calcium-calculator:
    build: .
    container_name: corrected-calcium-calculator
    ports:
      - "8000:8000"
    environment:
      # AUDIT_SECRET_KEY should be set externally (e.g., via .env file or secrets manager).
      # Do not hardcode production secrets here.
      - MODEL_PROVIDER=mock
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
